[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=60",
]

[project]
name = "wfde5-anemoi-plugins"
version = "0.1.0"
description = "Anemoi plugins for the WFDE5 near-real-time emulator: filters that derive ERA5 counterparts of WFDE5 variables, and a source that moves WFDE5 fluxes onto ERA5 timestamps."
readme = "README.md"
requires-python = ">=3.12"

authors = [
  { name = "Niclas Rieger", email = "niclas.rieger@ecmwf.int" },
]

license = "Apache-2.0"

keywords = [
  "anemoi",
  "datasets",
  "era5",
  "wfde5",
  "filter-plugin",
  "source-plugin",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
]

dependencies = [
  "anemoi-datasets>=0.5.40",
  "anemoi-transform>=0.4.2",
  "anemoi-utils>=0.5",
  "earthkit-data",
  "numpy",
]

[project.optional-dependencies]
test = [
  "pytest",
]

[project.urls]
Repository = "https://github.com/nicrie/wfde5-anemoi-plugins"

[project.entry-points."anemoi.transform.filters"]
tp_sf_to_rain = "wfde5_anemoi_plugins.filters.tp_sf_to_rain:TpSfToRain"
t_d_sp_to_q = "wfde5_anemoi_plugins.filters.t_d_sp_to_q:TDSpToQ"

[project.entry-points."anemoi.datasets.create.sources"]
wfde5-flux-era5-time = "wfde5_anemoi_plugins.sources.wfde5_flux_era5_time:Wfde5FluxEra5Time"

[tool.setuptools.packages.find]
include = ["wfde5_anemoi_plugins*"]
